
<!DOCTYPE html>
<html>
<head>
<title>User Dashboard</title>

<style>
body{
margin:0;
font-family:Arial;
background:#0f172a;
color:white;
}

.container{
display:flex;
height:100vh;
}

.sidebar{
width:200px;
background:#111827;
padding:20px;
}

.sidebar h3{
margin-bottom:20px;
}

.sidebar button{
width:100%;
padding:10px;
border:none;
background:red;
color:white;
cursor:pointer;
border-radius:5px;
}

.content{
flex:1;
padding:20px;
overflow-y:auto;
}

.card{
background:#1e293b;
padding:12px;
margin-top:10px;
border-radius:6px;
}

.time{
font-size:12px;
color:#94a3b8;
margin-top:8px;
}

img{
margin-top:8px;
border-radius:6px;
max-width:150px;
display:block;
}
</style>
</head>

<body>

<div class="container">

<!-- SIDEBAR -->
<div class="sidebar">
<h3>Team Member</h3>
<button onclick="logout()">Logout</button>
</div>

<!-- CONTENT -->
<div class="content">
<h2>My Messages</h2>
<div id="messages"></div>
</div>

</div>

<script>

const API="http://localhost:3000";

/* ---------------- GET USER SESSION ---------------- */

let currentUser=null;

try{
currentUser=JSON.parse(localStorage.getItem("user"));
}catch(e){
currentUser=null;
}

if(!currentUser || !currentUser.username){

alert("Session expired. Please login again.");

window.location.href="admin-user-login.html";

}

/* normalize username */

let username=currentUser.username.trim().toLowerCase();


/* ---------------- LOAD MESSAGES ---------------- */

async function loadMessages(){

try{

let res=await fetch(API+"/messages/"+username);

let data=await res.json();

let box=document.getElementById("messages");

box.innerHTML="";

if(!Array.isArray(data) || data.length===0){

box.innerHTML="<p>No messages found</p>";

return;

}

data.forEach(m=>{

let time="No date";

if(m.createdAt){

let d=new Date(m.createdAt);

time=d.toLocaleString();

}

let imageHTML="";

if(m.image){

imageHTML+=`<img src="${API}/uploads/${m.image}">`;

}

if(m.imageUrl){

imageHTML+=`<img src="${m.imageUrl}" onerror="this.style.display='none'">`;

}

box.innerHTML+=`

<div class="card">

<b>From Admin</b>

<p>${m.message || ""}</p>

${imageHTML}

<div class="time">${time}</div>

</div>

`;

});

}catch(err){

console.log("Error loading messages:",err);

}

}


/* ---------------- LOGOUT ---------------- */

function logout(){

localStorage.removeItem("user");

window.location.href="admin-user-login.html";

}


/* ---------------- INIT ---------------- */

loadMessages();

setInterval(loadMessages,3000);

</script>

</body>
</html>
